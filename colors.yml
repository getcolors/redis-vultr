# Desired state for redis-vultr. Non-secret values only.
# Credentials belong in the gitignored .envrc.private as COLORS_PAR_* variables.
# Never export COLORS_PAR_PROFILE: it selects this deployment's remote state.
#
# Required credentials:
#   Vultr            COLORS_PAR_VULTR_API_KEY
#   state in R2      COLORS_PAR_R2_ACCESS_KEY_ID
#                    COLORS_PAR_R2_SECRET_ACCESS_KEY
#                    (the shared tofu-state bucket; reaches no host)
#   backups in R2    COLORS_PAR_REDIS_BACKUP_R2_ACCESS_KEY_ID
#                    COLORS_PAR_REDIS_BACKUP_R2_SECRET_ACCESS_KEY
#                    (Object Read & Write on the langfuse-backup bucket ONLY;
#                    the one pair that reaches the host. .envrc maps the
#                    bucket's existing COLORS_PAR_LANGFUSE_BACKUP_R2_* pair
#                    onto these names, so .envrc.private can carry either)
#
# There is no DNS provider and no public Redis port: Redis is published on
# loopback and the VPC address only, the firewall opens 22 alone, and the
# client path is an SSH tunnel (ssh -L 6379:127.0.0.1:6379 redis-vultr). The
# password is generated on the server during convergence (create-once at
# /etc/redis/secrets/password) and is never operator-supplied.

profile: redis-vultr
workdir: .colors

provider-compute: vultr
provider-backend: r2

# Preserve this guard in committed desired state. Destruction requires an
# explicitly authorized one-run override; never edit this flag to bypass it.
compute-prevent-destroy: true

# --- Redis --------------------------------------------------------------------

# Redis 7.2, pinned by digest: Docker Hub republishes the 7.2 and 7.2.16 tags
# whenever the base image is rebuilt, so a tag alone does not pin bytes. The
# same image langfuse-vultr runs. The server runs with maxmemory-policy
# noeviction and an append-only file (appendfsync everysec) on a named
# volume, so a restart keeps every acknowledged write older than a second.
redis-image: docker.io/library/redis:7.2.16@sha256:74566c6910d13ae61e7ce73ebd3127438a1fe805b309b097c323142719ec8a5b
redis-port: 6379

# --- Backups in R2 ------------------------------------------------------------

# RDB snapshot sets under redis-vultr/redis/<stamp>/ in the langfuse-backup
# bucket, which already exists and whose scoped token this deployment reuses.
# Each set has a completion protocol (snapshot -> verified -> manifest ->
# .complete; restore picks only completed sets). `./green rehearse` restores
# the newest set into a scratch instance of the pinned image and reads the
# smoke key back, then writes redis-vultr/.colors-recovery-verified.
redis-backup-r2-bucket: langfuse-backup
redis-backup-r2-endpoint: https://319271fed8bc6d2d9059362be1165f37.eu.r2.cloudflarestorage.com
redis-backup-r2-region: auto
redis-backup-oncalendar: "*-*-* 00/6:00:00"
redis-backup-retention-days: 7
# A newest completed set older than this fails the monitor (and `describe`).
redis-backup-max-age-hours: 8

# --- Vultr --------------------------------------------------------------------

# No vultr-name: per workspace standards/compute-name.md the machine, its
# firewall group and its VPC are named after the profile: redis-vultr.
vultr-region: ams
# 1 vCPU / 2 GiB: Redis is single-threaded and this is a cache/queue tier.
vultr-plan: vc2-1c-2gb
# Vultr operating systems are numeric ids; 2284 is Ubuntu 24.04 LTS x64.
vultr-os-id: 2284
# The private network Redis is published on beside loopback. Nothing else is
# on it yet; a future peer needs a firewall rule for its /32 as well, because
# a Vultr firewall group filters the private interface too. 10.60 so it can
# never be confused with langfuse-vultr's 10.50.
vultr-vpc-subnet: 10.60.0.0/24

# No vultr-ssh-keys: keygen mode per workspace standards/ssh-keypair.md. The
# package generates and owns ~/.ssh/redis-vultr and registers the account key
# resource named after the profile. Setting vultr-ssh-keys here would switch
# this deployment to opt-out mode.

# SSH is the only open port: convergence, recovery, and the supported client
# path (the tunnel) all ride it.
vultr-ssh-sources:
  - 0.0.0.0/0
  - "::/0"

# --- OpenTofu state backend ---------------------------------------------------

r2-bucket: tofu-state-319271fed8bc6d2d9059362be1165f37-eu
r2-endpoint: https://319271fed8bc6d2d9059362be1165f37.eu.r2.cloudflarestorage.com
